[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackalem-meeting-minutes"
version = "0.1.0"
description = "HackAlem AI meeting transcription and protocol MVP"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "openai>=1.0,<3.0",
    "python-docx>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
local-kz = [
    "accelerate>=1.0,<2.0",
    "soundfile>=0.13,<1.0",
    "torch>=2.6,<3.0",
    "torchaudio>=2.6,<3.0",
    "transformers>=5.17,<6.0",
]

[project.scripts]
meeting-minutes = "meeting_minutes.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_minutes = ["fixtures/*.json", "templates/*.html", "static/*.css"]
